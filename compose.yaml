services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: churn
      POSTGRES_USER: churn
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U churn -d churn"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  churn-api:
    build: .
    ports:
      - "8000:8000"
    environment:
      PREDICTION_DATABASE_URL: postgresql+psycopg://churn:${POSTGRES_PASSWORD:-local-development-password}@database:5432/churn
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    ports:
      - "8501:8501"
    environment:
      API_URL: http://churn-api:8000
    depends_on:
      churn-api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
