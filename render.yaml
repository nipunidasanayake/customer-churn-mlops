services:
  - type: web
    name: customer-churn-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PREDICTION_DB_PATH
        value: /tmp/predictions.db
      - key: MODEL_ARTIFACT_DIR
        value: /tmp/churn-model-artifacts
      - key: MODEL_BUNDLE_URL
        sync: false
      - key: MODEL_BUNDLE_SHA256
        sync: false
      - key: MODEL_BUNDLE_TOKEN
        sync: false

  - type: web
    name: customer-churn-dashboard
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile.dashboard
    dockerContext: .
    autoDeploy: true
    envVars:
      - key: API_URL
        value: https://customer-churn-api.onrender.com
