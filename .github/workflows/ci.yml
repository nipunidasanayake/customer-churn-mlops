name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: churn
          POSTGRES_PASSWORD: local-development-password
          POSTGRES_USER: churn
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U churn -d churn"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_POSTGRES_DATABASE_URL: postgresql+psycopg://churn:local-development-password@localhost:5432/churn
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: pytest -q
      - name: Validate Docker Compose
        run: docker compose config
      - name: Build API Docker image
        run: docker build -t customer-churn-mlops:ci .
      - name: Build dashboard Docker image
        run: docker build -f Dockerfile.dashboard -t customer-churn-dashboard:ci .
