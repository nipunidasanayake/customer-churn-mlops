name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: churn
          POSTGRES_PASSWORD: local-development-password
          POSTGRES_USER: churn
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U churn -d churn"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_POSTGRES_DATABASE_URL: postgresql+psycopg://churn:local-development-password@localhost:5432/churn
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: pytest -q
      - name: Validate Docker Compose
        run: docker compose config
      - name: Build API Docker image
        run: docker build -t customer-churn-mlops:ci .
      - name: Build dashboard Docker image
        run: docker build -f Dockerfile.dashboard -t customer-churn-dashboard:ci .
      - name: Set lowercase image name
        if: github.event_name == 'push'
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Set up Docker Buildx
        if: github.event_name == 'push'
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish API image to GHCR
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.name }}-api:latest
            ${{ steps.image.outputs.name }}-api:${{ github.sha }}
      - name: Publish dashboard image to GHCR
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.dashboard
          push: true
          tags: |
            ${{ steps.image.outputs.name }}-dashboard:latest
            ${{ steps.image.outputs.name }}-dashboard:${{ github.sha }}
